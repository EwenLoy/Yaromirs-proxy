[workspace]
resolver = "2"
members = [
    "crates/rproxy-core",
    "crates/rproxy-cert",
    "crates/rproxy-cli",
    "crates/rproxy-export",
    "crates/rproxy-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
eframe = "0.29"
egui = "0.29"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = "0.26"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
lto = "thin"

